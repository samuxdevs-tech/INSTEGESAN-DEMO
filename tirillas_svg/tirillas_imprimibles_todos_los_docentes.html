        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 10mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            break-after: page;
        }
        .card-wrapper {
            border: 1.5px dashed #94A3B8;
            padding: 2px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .card-wrapper::after {
            content: '✂ Recortar';
            position: absolute;
            top: -9px;
            right: 15px;
            background: white;
            padding: 0 4px;
            font-size: 9px;
            color: #64748B;
            font-weight: bold;
        }
        .card-wrapper svg {
            width: 100%;
            height: auto;
        }
        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #1D4ED8;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4);
            z-index: 999;
        }
        .print-btn:hover {
            background: #1E40AF;
        }
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .page {
                box-shadow: none;
                margin: 0;
                padding: 8mm;
                width: 100%;
                height: 100%;
            }
            .print-btn {
                display: none;
            }
        }
    </style>
